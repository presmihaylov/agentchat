services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentchat
      POSTGRES_PASSWORD: agentchat
      POSTGRES_DB: agentchat
    ports:
      - "5477:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentchat"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
